# -- Default values for chart vllm
# -- Declare variables to be passed into your templates.

# -- Image configuration
image:
  # -- Image repository
  repository: "vllm/vllm-openai"
  # -- Image tag
  tag: "latest"
  # -- Container launch command
  command: ["vllm", "serve", "/data/", "--served-model-name", "opt-125m", "--enforce-eager", "--dtype", "bfloat16", "--block-size", "16", "--host", "0.0.0.0", "--port", "8000"]

# -- Container port
containerPort: 8000
# -- Service name
serviceName:
# -- Service port
servicePort: 80
# -- Additional ports configuration
extraPorts: []

# -- Number of replicas
replicaCount: 1

# -- Deployment strategy configuration
deploymentStrategy: {}

# -- Resource configuration
resources:
  requests:
    # -- Number of CPUs
    cpu: 4
    # -- CPU memory configuration
    memory: 16Gi
    # -- Number of gpus used
    nvidia.com/gpu: 1
  limits:
    # -- Number of CPUs
    cpu: 4
    # -- CPU memory configuration
    memory: 16Gi
    # -- Number of gpus used
    nvidia.com/gpu: 1

# -- Type of gpu used
gpuModels:
  - "TYPE_GPU_USED"

# -- Autoscaling configuration (plain Kubernetes HPA on CPU/memory).
# Mutually exclusive with .Values.keda -- do not enable both, they will
# fight over control of the same Deployment's replica count.
autoscaling:
  # -- Enable autoscaling
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 100
  # -- Target CPU utilization for autoscaling
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- KEDA-based autoscaling on vLLM's own queue-depth metric
# (vllm:num_requests_waiting) via a Prometheus scaler. Preferred over
# .Values.autoscaling (HPA) for GPU-bound workloads, where CPU/memory
# utilization doesn't reflect real load. Requires the KEDA operator/CRDs
# installed cluster-wide and a Prometheus instance scraping this pod (see
# .Values.podAnnotations). Mutually exclusive with .Values.autoscaling.
keda:
  # -- Enable a KEDA ScaledObject for this deployment
  enabled: false
  # -- Minimum replicas. Set to 0 to allow scale-to-zero (e.g. combined
  # with keda.cron for business-hours scheduling); keep >=1 if you always
  # want one GPU replica warm to avoid cold-start cost.
  minReplicaCount: 1
  # -- Maximum replicas
  maxReplicaCount: 3
  # -- How often (seconds) KEDA polls the Prometheus query
  pollingInterval: 15
  # -- How long (seconds) load must stay below threshold before scaling a replica down
  cooldownPeriod: 120
  # -- Optional: seconds after ScaledObject creation before the first scale-down is allowed
  initialCooldownPeriod: 0
  # -- Optional advanced HPA scale-down behavior (anti-thrashing). Unset by
  # default (stabilizationWindowSeconds: null) so existing users see no
  # behavior change -- the underlying HPA controller's own default applies.
  # When set, this is passed through to the HPA's
  # advanced.horizontalPodAutoscalerConfig.behavior.scaleDown block. See
  # templates/scaledobject.yaml for the full rationale on why this matters
  # for GPU-backed replicas that take real time (node boot + image pull +
  # model cold start) to become useful.
  scaleDown:
    # -- How far back (seconds) HPA looks when deciding to scale down; the
    # HIGHEST recommended replica count seen in this window is used, so a
    # brief metric dip can't trigger an immediate scale-down. Recommend
    # setting this to at least (time for a new replica to become useful) +
    # (time to complete a few real jobs).
    stabilizationWindowSeconds: null
    # -- Once the stabilization window has passed, the max percent of
    # current replicas that can be removed per policyPeriodSeconds.
    policyPercent: 33
    policyPeriodSeconds: 60
  # -- Prometheus server address to query, e.g. http://prometheus-server.vllm.svc.cluster.local:9090
  prometheusServerAddress: ""
  # -- PromQL query; must return a single vector/scalar element. sum() is
  # required once there's more than one replica, since each pod exposes its
  # own gauge value as a separate scrape target/time series.
  query: "sum(vllm:num_requests_waiting)"
  # -- Threshold for the proportional scaling formula:
  # desiredReplicas = ceil(currentReplicas * currentMetricValue / threshold).
  # This is NOT a strict step function -- see chart README/PR notes for the
  # worked example of how this behaves at low replica counts.
  threshold: "2"

  # -- Optional business-hours scheduling via KEDA's cron trigger, combined
  # with the Prometheus trigger above in the same ScaledObject. KEDA takes
  # the max desired replica count across triggers for scale-up decisions:
  # the cron trigger guarantees at least `desiredReplicas` during its
  # start-end window (avoiding cold-start pain from scaling all the way to
  # zero between requests during business hours) and contributes nothing
  # outside that window -- it does NOT forcibly block the Prometheus
  # trigger from scaling up outside the window if there's real demand, so
  # this is a cost-saving default, not a hard access control.
  # Requires keda.minReplicaCount: 0 to actually reach zero outside the
  # window -- plain HPA can't scale to zero, but KEDA can.
  cron:
     # -- Enable the cron trigger
    enabled: false
    # -- IANA timezone name (handles DST automatically, e.g. EST/EDT) --
    # NOT a fixed UTC offset.
    timezone: "America/New_York"
    # -- Standard 5-field cron expression for when the window starts
    start: "0 6 * * *"
    # -- Standard 5-field cron expression for when the window ends
    end: "0 22 * * *"
    # -- Guaranteed replica count during the start-end window
    desiredReplicas: "1"

  # -- LEGACY: redis-streams trigger from the pre-NATS Valkey path.
  # Leave disabled for NATS JetStream deployments; use natsJetStream below
  # (and/or the prometheus trigger) instead. Kept so existing overlays that
  # still set keda.redisStreams.enabled=true continue to render.
  redisStreams:
    # -- Enable the redis-streams trigger
    enabled: false
    # -- Redis server address (host:port), e.g. "redis:6379" or "valkey:6379"
    address: ""
    # -- Redis stream name to monitor
    stream: ""
    # -- Consumer group name for the stream
    consumerGroup: ""
    # -- Target threshold for consumer-group lag (messages in the stream not
    # yet delivered to any consumer in this group). KEDA scales up when lag
    # exceeds this. This is the correct backlog signal for a consumer that
    # deliberately processes only a small number of messages concurrently --
    # unlike pendingEntriesCount (PEL), lag reflects true undelivered
    # backlog regardless of how conservatively the consumer claims work.
    lagCount: "5"
    # -- Minimum lag before the trigger is considered "active" at all (KEDA
    # won't scale off zero-replica floor for lag below this). Kept low so a
    # genuine backlog is still detected promptly.
    activationLagCount: "1"

  # -- Optional nats-jetstream trigger for scaling on JetStream consumer lag
  # (num_pending + num_ack_pending via the NATS monitoring endpoint).
  # When enabled, this trigger is added alongside prometheus / cron / the
  # legacy redisStreams trigger -- KEDA takes the max desired replica count
  # across all of them. Requires the NATS HTTP monitor (port 8222) to be
  # reachable from the KEDA operator (use a fully-qualified service name).
  natsJetStream:
    # -- Enable the nats-jetstream trigger
    enabled: false
    # -- NATS monitoring endpoint (host:port), e.g. "nats.nats.svc.cluster.local:8222"
    natsServerMonitoringEndpoint: ""
    # -- NATS account. "$G" is the default account when none is configured.
    account: "$G"
    # -- JetStream stream name (must match RTR_STREAM_NAME)
    stream: "vllm_requests"
    # -- Durable consumer name (must match RTR_CONSUMER_NAME; shared by all sidecars)
    consumer: "vllm-sidecars"
    # -- Target lag to trigger scale-up
    lagThreshold: "5"
    # -- Minimum lag before the trigger is considered active (scale-from-zero)
    activationLagThreshold: "1"

# -- Additional annotations applied to the pod template. Commonly used for
# Prometheus annotation-based scrape discovery, e.g.:
#   podAnnotations:
#     prometheus.io/scrape: "true"
#     prometheus.io/port: "8000"
#     prometheus.io/path: "/metrics"
podAnnotations: {}

# -- Image pull secrets for pulling from private registries (e.g. GHCR).
# List of secret references in the format: [{name: "secret-name"}, ...]
imagePullSecrets: []

# -- How long Kubernetes waits after sending SIGTERM before force-killing
# the pod (SIGKILL). Left unset by default (Kubernetes' own built-in
# default of 30s applies) to avoid changing behavior for existing users.
# If the sidecar is enabled and expected to hold long-running in-flight
# requests (e.g. large-context LLM inference that can take several
# minutes), this MUST be raised well above the realistic worst-case job
# duration -- otherwise Kubernetes will SIGKILL the pod mid-job during a
# scale-down/node-drain before the sidecar's own graceful-drain logic
# (see cmd/cli sidecar flag max-drain-timeout / RTR_MAX_DRAIN_TIMEOUT)
# has a chance to finish.
terminationGracePeriodSeconds: null

# -- Configmap
configs: {}

# -- Secrets configuration
secrets: {}

# -- External configuration
externalConfigs: []

# -- Custom Objects configuration
customObjects: []

# -- Disruption Budget Configuration
maxUnavailablePodDisruptionBudget: ""

# -- Additional configuration for the init container
extraInit:
  # -- Model download functionality (optional)
  modelDownload:
    # -- Enable model download job and wait container
    enabled: true
    # -- Image configuration for model download operations
    image:
      # -- Image repository
      repository: "amazon/aws-cli"
      # -- Image tag
      tag: "2.6.4"
      # -- Image pull policy
      pullPolicy: "IfNotPresent"
    # -- Wait container configuration (init container that waits for model to be ready)
    waitContainer:
      # -- Command to execute
      command: ["/bin/bash"]
      # -- Arguments for the wait container
      args:
        - "-eucx"
        - "while aws --endpoint-url $S3_ENDPOINT_URL s3 sync --dryrun s3://$S3_BUCKET_NAME/$S3_PATH /data | grep -q download; do sleep 10; done"
      # -- Environment variables (optional, overrides S3 defaults entirely if specified)
      # env:
      #   - name: HUGGING_FACE_HUB_TOKEN
      #     value: "your-token"
      #   - name: MODEL_ID
      #     value: "meta-llama/Llama-2-7b"
    # -- Download job configuration (job that actually downloads the model)
    downloadJob:
      # -- Command to execute
      command: ["/bin/bash"]
      # -- Arguments for the download job
      args:
        - "-eucx"
        - "aws --endpoint-url $S3_ENDPOINT_URL s3 sync s3://$S3_BUCKET_NAME/$S3_PATH /data"
      # -- Environment variables (optional, overrides S3 defaults entirely if specified)
      # env:
      #   - name: HUGGING_FACE_HUB_TOKEN
      #     value: "your-token"
      #   - name: MODEL_ID
      #     value: "meta-llama/Llama-2-7b"

  # -- Custom init containers (appended after wait-download-model if modelDownload is enabled)
  initContainers: []
  # Example for llm-d sidecar:
  # initContainers:
  #   - name: llm-d-routing-proxy
  #     image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.2.0
  #     imagePullPolicy: IfNotPresent
  #     ports:
  #       - containerPort: 8080
  #         name: proxy
  #     securityContext:
  #       runAsUser: 1000

  # -- Path of the model on the s3 which hosts model weights and config files
  s3modelpath: "relative_s3_model_path/opt-125m"
  # -- Storage size for the PVC
  pvcStorage: "1Gi"
  # -- Access mode for the model-cache PVC. Default ReadWriteOnce works for
  # a single replica (e.g. plain EBS gp3). For multiple replicas across
  # different nodes (e.g. behind a KEDA ScaledObject), EBS's RWO can't be
  # shared -- a volume can only attach to one node at a time, so replica
  # pods on other nodes would be stuck waiting on an attach that can never
  # succeed. Set to ReadWriteMany with an RWX-capable storageClassName
  # (e.g. an EFS-backed StorageClass) to let every replica mount the same
  # already-downloaded model cache regardless of which node it lands on.
  pvcAccessMode: "ReadWriteOnce"
  # -- StorageClassName for the model-cache PVC. Leave unset to use the
  # cluster's default StorageClass (today's behavior, unchanged). Required
  # if pvcAccessMode is ReadWriteMany, since the default StorageClass is
  # typically block storage (e.g. gp3/EBS) which doesn't support it.
  pvcStorageClassName: ""
  # -- Disable AWS EC2 metadata service
  awsEc2MetadataDisabled: true

# -- Additional containers configuration
extraContainers: []

# -- Sidecar container configuration (optional, disabled by default)
sidecar:
  # -- Enable the sidecar container
  enabled: false
  # -- Extra labels on the vLLM worker *pod template only* (not
  # spec.selector). Sidecar shares that pod, so OTel autodiscovery identity
  # for the sidecar (app.kubernetes.io/name, otel.io/enabled) goes here.
  labels: {}
  # -- Sidecar Prometheus /metrics listen port (RTR_METRICS_PORT default)
  metricsPort: 9100
  # -- Image configuration for the sidecar
  image:
    # -- Image repository
    repository: "ghcr.io/rvo-redplatform/vllm-sidecar"
    # -- Image tag
    tag: "latest"
  # -- Environment variables for the sidecar (cobra/viper prefix RTR_).
  # This list is passed through as-is; production overlays should replace it
  # with cluster DNS for NATS (e.g. nats://nats.nats.svc.cluster.local:4222).
  # Do not set a per-pod CONSUMER_NAME -- JetStream WorkQueue uses one shared
  # durable (RTR_CONSUMER_NAME) that every sidecar replica pulls.
  # RTR_WORKER_POOL_SIZE is omitted so the CLI default (32) applies. This
  # only bounds in-flight burst-fill speed to vLLM, NOT a safety ceiling --
  # correctness comes from vLLM's own capacity gate
  # (vllm:num_requests_waiting_by_reason{reason="capacity"}), which every
  # worker respects regardless of pool size. A generous value (even 100) is
  # safe here.
  env:
    # -- NATS server URL (required)
    - name: RTR_NATS_URL
      value: "nats://nats:4222"
    # -- JetStream stream name (optional, CLI default vllm_requests)
    - name: RTR_STREAM_NAME
      value: "vllm_requests"
    # -- JetStream subject (optional, CLI default vllm.requests)
    - name: RTR_STREAM_SUBJECT
      value: "vllm.requests"
    # -- Shared durable consumer name (optional, CLI default vllm-sidecars)
    - name: RTR_CONSUMER_NAME
      value: "vllm-sidecars"
    # -- vLLM upstream URL (required). Same-pod sidecars use localhost.
    - name: RTR_VLLM_TARGET
      value: "http://localhost:8000"
    # -- Maximum process timeout (sidecar, default 10m). Acts as a job kill switch.
    # Must be <= RTR_MAX_DRAIN_TIMEOUT and <= Kubernetes terminationGracePeriodSeconds.
    # Proxy RTR_REQUEST_TIMEOUT / RTR_STREAM_TIMEOUT must be >= this value.
    - name: RTR_MAX_PROCESS_TIMEOUT
      value: "10m"

# -- Standalone proxy Deployment+Service configuration (optional, disabled by default)
proxy:
  # -- Enable the standalone proxy Deployment and Service
  enabled: false
  # -- Number of proxy replicas
  replicaCount: 1
  # -- Image configuration for the proxy
  image:
    # -- Image repository
    repository: "ghcr.io/rvo-redplatform/vllm-proxy"
    # -- Image tag
    tag: "latest"
  # -- Environment variables for the proxy (cobra/viper prefix RTR_).
  # Flag is `port` (RTR_PORT), not listen-port.
  env:
    # -- NATS server URL (required)
    RTR_NATS_URL: "nats://nats:4222"
    # -- JetStream stream name (optional, CLI default vllm_requests)
    RTR_STREAM_NAME: "vllm_requests"
    # -- JetStream subject (optional, CLI default vllm.requests)
    RTR_STREAM_SUBJECT: "vllm.requests"
    # -- Proxy listen port (required)
    RTR_PORT: "8080"
    # -- Maximum request body size in bytes (optional, default 10 MiB)
    RTR_MAX_BODY_BYTES: ""
    # -- Request timeout duration (optional; empty uses CLI default 1h).
    # Must be >= sidecar RTR_MAX_PROCESS_TIMEOUT.
    RTR_REQUEST_TIMEOUT: ""
    # -- Stream timeout duration (optional; empty uses CLI default 1h).
    # Must be >= sidecar RTR_MAX_PROCESS_TIMEOUT.
    RTR_STREAM_TIMEOUT: ""
  # -- Service port for the proxy
  servicePort: 8080
  # -- Extra labels on the proxy *pod template only* (not spec.selector).
  # Use this for OTel autodiscovery (app.kubernetes.io/name, otel.io/enabled).
  podLabels: {}
  # -- Proxy Prometheus /metrics listen port (RTR_METRICS_PORT default)
  metricsPort: 9100
  # -- Pod annotations for the proxy
  podAnnotations: {}
  # -- Resource requests and limits for the proxy
  resources: {}
  # -- Node selector for the proxy pod
  nodeSelector: {}
  # -- Tolerations for the proxy pod
  tolerations: []

# -- Readiness probe configuration
readinessProbe:
  # -- Number of seconds after the container has started before readiness probe is initiated
  initialDelaySeconds: 5
  # -- How often (in seconds) to perform the readiness probe
  periodSeconds: 5
  # -- Number of times after which if a probe fails in a row, Kubernetes considers that the overall check has failed: the container is not ready
  failureThreshold: 3
   # -- Configuration of the Kubelet http request on the server
  httpGet:
    # -- Path to access on the HTTP server
    path: /health
    # -- Name or number of the port to access on the container, on which the server is listening
    port: 8000

# -- Liveness probe configuration
livenessProbe:
 # -- Number of seconds after the container has started before liveness probe is initiated
  initialDelaySeconds: 15
  # -- Number of times after which if a probe fails in a row, Kubernetes considers that the overall check has failed: the container is not alive
  failureThreshold: 3
  # -- How often (in seconds) to perform the liveness probe
  periodSeconds: 10
  # -- Configuration of the Kubelet http request on the server
  httpGet:
    # -- Path to access on the HTTP server
    path: /health
    # -- Name or number of the port to access on the container, on which the server is listening
    port: 8000

# Used as Deployment spec.selector.matchLabels (immutable after create)
# AND as the base pod labels. Do not add scrape/OTel identity keys here --
# they would change the selector on existing releases. Put those on
# sidecar.labels / proxy.podLabels / podLabels / vllm.podLabels (pod template only).
labels:
  environment: "test"
  release: "test"

# -- Extra labels on the vLLM worker pod template only (not spec.selector).
podLabels: {}

vllm:
  podLabels: {}
