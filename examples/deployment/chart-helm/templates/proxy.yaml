{{- if .Values.proxy.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-deployment-proxy" .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "chart.labels" . | nindent 6 }}
      app: proxy
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app: proxy
        {{- with .Values.proxy.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.proxy.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: "proxy"
          image: "{{ required "Required value 'proxy.image.repository' must be defined !" .Values.proxy.image.repository }}:{{ required "Required value 'proxy.image.tag' must be defined !" .Values.proxy.image.tag }}"
          imagePullPolicy: Always
          env:
            - name: RTR_NATS_URL
              value: {{ required "Required value 'proxy.env.RTR_NATS_URL' must be defined !" .Values.proxy.env.RTR_NATS_URL | quote }}
            {{- if .Values.proxy.env.RTR_STREAM_NAME }}
            - name: RTR_STREAM_NAME
              value: {{ .Values.proxy.env.RTR_STREAM_NAME | quote }}
            {{- end }}
            {{- if .Values.proxy.env.RTR_STREAM_SUBJECT }}
            - name: RTR_STREAM_SUBJECT
              value: {{ .Values.proxy.env.RTR_STREAM_SUBJECT | quote }}
            {{- end }}
            - name: RTR_PORT
              value: {{ required "Required value 'proxy.env.RTR_PORT' must be defined !" .Values.proxy.env.RTR_PORT | quote }}
            {{- if .Values.proxy.env.RTR_MAX_BODY_BYTES }}
            - name: RTR_MAX_BODY_BYTES
              value: {{ .Values.proxy.env.RTR_MAX_BODY_BYTES | quote }}
            {{- end }}
            {{- if .Values.proxy.env.RTR_REQUEST_TIMEOUT }}
            - name: RTR_REQUEST_TIMEOUT
              value: {{ .Values.proxy.env.RTR_REQUEST_TIMEOUT | quote }}
            {{- end }}
            {{- if .Values.proxy.env.RTR_STREAM_TIMEOUT }}
            - name: RTR_STREAM_TIMEOUT
              value: {{ .Values.proxy.env.RTR_STREAM_TIMEOUT | quote }}
            {{- end }}
          ports:
            - name: proxy-port
              containerPort: {{ .Values.proxy.env.RTR_PORT | int }}
            - name: metrics
              containerPort: {{ .Values.proxy.metricsPort | default 9100 | int }}
           {{- if .Values.proxy.resources }}
           resources:
             {{- toYaml .Values.proxy.resources | nindent 12 }}
           {{- end }}
       {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
       {{- with .Values.proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-service-proxy" .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: proxy-port
      port: {{ .Values.proxy.servicePort | default 8080 }}
      targetPort: proxy-port
      protocol: TCP
  selector:
    {{- include "chart.labels" . | nindent 4 }}
    app: proxy
{{- end }}
